# Release (P24A, D-167): publishes ONE named commit of this repository with GitHub Pages' own deployment, from this
# repository, to https://www.gusmaolab.org (the Pages site's custom domain). It is the only workflow that deploys, and it is
# manual: nothing here runs on a push. No key, no token and no second repository: the deploy job proves who it is with a
# short-lived OpenID Connect token, which is what `id-token: write` allows.
#
#   build   checks the inputs; checks that the commit is on both main and development (an unexpected divergence blocks
#           the release) and that the Quality Assurance workflow passed on it; runs the quick QA profile; builds with
#           `npm run build`; checks the artifact (scripts/release-check.mjs); uploads it as the Pages artifact.
#   deploy  the `github-pages` environment (only main may deploy to it): GitHub Pages publishes the artifact.
#   verify  smoke-tests the live address until it serves exactly what was built (scripts/smoke.mjs), and records the
#           release: the source commit, the deployment URL and the run.
#
# Every action is pinned to the full commit SHA of a verified upstream release, with the version in a comment.
name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character SHA of the commit to release (it must be on main and on development)"
        required: true
        type: string
      confirm:
        description: "Type www.gusmaolab.org to confirm the destination"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check the inputs
        env:
          COMMIT: ${{ inputs.commit }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character lowercase SHA"; exit 1; }
          [ "$CONFIRM" = "www.gusmaolab.org" ] || { echo "::error::confirm must be exactly www.gusmaolab.org"; exit 1; }
      - name: Check out the commit with its full history (read-only, no stored credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: The commit is on main and on development
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::$COMMIT is not on main: fast-forward main to it first"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/development || { echo "::error::$COMMIT is not on development: release only accepted development work"; exit 1; }
      - name: The Quality Assurance workflow passed on this commit
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml --commit "$COMMIT" --status completed --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$result" -ge 1 ] || { echo "::error::no successful Quality Assurance run on $COMMIT"; exit 1; }
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Quality assurance, quick profile
        run: node scripts/qa.mjs --profile quick
      - name: Build the release
        run: npm run build
      - name: Check the release artifact
        run: node scripts/release-check.mjs dist
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - name: Keep the build for the smoke test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-site
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Smoke-test the live site and record the release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the release scripts at the same commit (read-only, no stored credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Take the build that was deployed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-site
          path: site
      - name: Smoke-test the live site until it serves exactly this release
        run: node scripts/smoke.mjs https://www.gusmaolab.org --dist site --wait 900
      - name: Record the release
        if: always()
        env:
          COMMIT: ${{ inputs.commit }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          {
            echo "### Release"
            echo "- Source commit: \`$COMMIT\`"
            echo "- Deployed to: ${PAGE_URL:-unknown}"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Rollback: run this workflow again with the previous release's commit"
          } >> "$GITHUB_STEP_SUMMARY"
