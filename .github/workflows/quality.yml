# Quality assurance (P22, D-156). Verifies; it never deploys. It publishes nothing, has no write access to the
# repository, uses no secret, and the legacy placeholder workflows beside it are untouched. What it runs is the
# same command a developer runs locally (`npm run qa`, scripts/qa.mjs), so a result here and a result there mean
# the same thing: PASS, FAIL, SKIPPED, DEFERRED, NOT RUN or FLAKY, with a mandatory FAIL, NOT RUN or
# unregistered FLAKY failing the job. The Cal.com booking checks are DEFERRED (owner decision) and do not fail it.
#
# Two jobs, so a static problem is reported in minutes and the browser job's cost is paid only when it can matter:
#   static   Node, `npm ci`, diagnostics, the production build, every unit suite, the static audits.
#   browser  the build, the demonstration build, the browser suites (one reported retry), accessibility, performance.
# Quarto and the scientific environment are not installed: the suites that need them report SKIPPED, and say so.
# Chrome is the runner's own (google-chrome); no other browser is installed, and no cross-browser claim is made.
name: Quality Assurance

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      profile:
        description: "QA profile for the browser job (full, or deep to run each browser suite three times)"
        type: choice
        options: [full, deep]
        default: full

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository (read-only, no stored credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Quality assurance, quick profile
        run: node scripts/qa.mjs --profile quick
      - name: Keep the report (small)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-static
          path: |
            qa-report/latest.json
            qa-report/latest.md
          retention-days: 14
          if-no-files-found: warn
      - name: Keep the logs, only when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs-static
          path: qa-report/logs/
          retention-days: 14
          if-no-files-found: ignore

  browser:
    name: Browser regression, accessibility and performance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out the repository (read-only, no stored credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Quality assurance, browser stages
        run: node scripts/qa.mjs --profile ${{ inputs.profile || 'full' }} --only environment,build,demo-build,browser,performance
      - name: Keep the report (small)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-browser
          path: |
            qa-report/latest.json
            qa-report/latest.md
            qa-report/performance.json
            qa-report/accessibility.json
          retention-days: 14
          if-no-files-found: warn
      - name: Keep the logs and failure screenshots, only when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-browser
          path: |
            qa-report/logs/
            qa-report/evidence/
          retention-days: 14
          if-no-files-found: ignore
